<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeedyBD.com - Trustworthy Service</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Hind Siliguri,sans-serif}
body{background:#f0f2f5}.header{background:#fff;padding:14px;text-align:center;font-weight:900;color:#000080;position:sticky;top:0;z-index:100;box-shadow:0 2px 5px rgba(0,0,0,0.1)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.08)}
.card img{width:100%;height:130px;object-fit:cover}.card-body{padding:10px}
.hire{background:#000080;color:#fff;border:none;width:100%;padding:7px;border-radius:6px;margin-top:6px;font-weight:bold}
.join{position:fixed;bottom:20px;right:15px;background:linear-gradient(45deg,red,navy);color:#fff;border:none;padding:15px 22px;border-radius:30px;font-weight:bold;z-index:999;box-shadow:0 4px 15px rgba(0,0,0,0.3)}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:1000;padding:15px;overflow:auto}
.box{background:#fff;max-width:420px;margin:20px auto;padding:20px;border-radius:14px}
.box h3{text-align:center;color:navy;margin-bottom:10px}
.box input,.box select,.box textarea{width:100%;padding:12px;margin:6px 0;border:1px solid #ccc;border-radius:8px}
.box button{width:100%;padding:13px;border:none;border-radius:8px;font-weight:bold;margin-top:10px}
.btn-save{background:#000080;color:#fff}.btn-cancel{background:#eee;color:#333}
#msg{text-align:center;margin-top:10px;font-weight:bold}
</style>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>
<div class="header">NEEDYBD.COM - TRUSTWORTHY SERVICE</div>
<div id="grid" class="grid">লোড হচ্ছে...</div>
<button class="join" onclick="openModal()">+ কর্মী হিসেবে যোগ দিন</button>

<div id="modal"><div class="box">
<h3>নিজের প্রোফাইল তৈরি করুন</h3>
<input id="n" placeholder="আপনার নাম *">
<select id="j"><option value="">পেশা নির্বাচন করুন *</option><option>ইলেকট্রিশিয়ান</option><option>রাজমিস্ত্রি</option><option>প্লাম্বার</option><option>ডাক্তার</option><option>নার্স</option><option>ড্রাইভার</option><option>ক্লিনার</option></select>
<input id="d" placeholder="জেলা (যেমন: ফেনী)">
<input id="p" placeholder="ফোন নাম্বার *">
<input id="ex" placeholder="অভিজ্ঞতা (যেমন: ৫ বছর)">
<input id="fee" placeholder="মজুরি (যেমন: 500 টাকা)">
<textarea id="desc" placeholder="আপনার সম্পর্কে কিছু লিখুন"></textarea>
<input id="img" placeholder="ছবির লিংক (না দিলেও চলবে)">
<button class="btn-save" id="saveBtn" onclick="saveWorker()">প্রোফাইল তৈরি করুন</button>
<button class="btn-cancel" onclick="closeModal()">বাতিল</button>
<p id="msg"></p>
</div></div>

<script>
// তোমার ডাটাবেস কানেকশন - এটাই আসল, ছোট হলেও এটাই কাজ করে
var firebaseConfig={databaseURL:"https://needybd-70d0b-default-rtdb.firebaseio.com"};
firebase.initializeApp(firebaseConfig);
var db=firebase.database();

function openModal(){document.getElementById('modal').style.display='block';}
function closeModal(){document.getElementById('modal').style.display='none';}

// ডাটা দেখানো
db.ref('workers').on('value',function(snap){
 var grid=document.getElementById('grid');grid.innerHTML='';
 if(!snap.exists()){grid.innerHTML='<p style="grid-column:1/-1;text-align:center;padding:30px;color:gray">এখনো কোনো কর্মী যোগ দেননি</p>';return;}
 snap.forEach(function(c){
  var w=c.val();
  var div=document.createElement('div');div.className='card';
  div.innerHTML='<img src="'+(w.photo||'https://i.imgur.com/8Km9tLL.png')+'"><div class="card-body"><b>'+w.name+'</b><br><small>'+w.job+' | '+(w.district||'')+'</small><br><small style="color:green;font-weight:bold">'+(w.fee||'')+'</small><button class="hire" onclick="window.open(\'tel:'+w.phone+'\')">কল: '+w.phone+'</button></div>';
  grid.appendChild(div);
 });
});

// প্রোফাইল সেভ - এটা ১০০% ফিক্স করা
function saveWorker(){
 var btn=document.getElementById('saveBtn');
 var msg=document.getElementById('msg');
 var data={
  name:document.getElementById('n').value.trim(),
  job:document.getElementById('j').value,
  district:document.getElementById('d').value.trim(),
  phone:document.getElementById('p').value.trim(),
  experience:document.getElementById('ex').value.trim(),
  fee:document.getElementById('fee').value.trim(),
  description:document.getElementById('desc').value.trim(),
  photo:document.getElementById('img').value.trim()||'https://i.imgur.com/8Km9tLL.png',
  time:Date.now()
 };
 if(!data.name||!data.job||!data.phone){alert('সোনা, নাম, পেশা, ফোন এই ৩টা অবশ্যই দিতে হবে!');return;}
 
 msg.style.color='orange';
 msg.innerText='সেভ হচ্ছে, একটু অপেক্ষা করুন...';
 btn.disabled=true;

 db.ref('workers').push(data).then(function(){
  msg.style.color='green';
  msg.innerText='সফল! প্রোফাইল তৈরি হয়েছে! ✅';
  setTimeout(closeModal,1500);
  btn.disabled=false;
 }).catch(function(e){
  msg.style.color='red';
  msg.innerText='';
  alert('Error: '+e.message);
  btn.disabled=false;
 });
}
</script>
</body>
</html>
