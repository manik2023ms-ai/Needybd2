<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeedyBD.com</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#f0f2f5}.header{background:#fff;padding:14px;text-align:center;font-weight:900;color:#000080;position:sticky;top:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.card{background:#fff;border-radius:12px;overflow:hidden}
.card img{width:100%;height:130px;object-fit:cover}.card-body{padding:10px}
.hire{background:#000080;color:#fff;border:none;width:100%;padding:7px;border-radius:6px;margin-top:6px}
.join{position:fixed;bottom:20px;right:15px;background:linear-gradient(45deg,red,navy);color:#fff;border:none;padding:15px 22px;border-radius:30px;font-weight:bold;z-index:999}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:1000;padding:15px;overflow:auto}
.box{background:#fff;max-width:420px;margin:20px auto;padding:20px;border-radius:14px}
.box input,.box select,.box textarea{width:100%;padding:12px;margin:6px 0;border:1px solid #ccc;border-radius:8px}
.box button{width:100%;padding:13px;border:none;border-radius:8px;font-weight:bold;margin-top:10px}
.btn-save{background:#000080;color:#fff}.btn-cancel{background:#eee}
</style>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>
<div class="header">NEEDYBD.COM - TRUSTWORTHY SERVICE</div>
<div id="grid" class="grid">লোড হচ্ছে...</div>
<button class="join" onclick="openModal()">+ কর্মী হিসেবে যোগ দিন</button>
<div id="modal"><div class="box">
<h3 style="text-align:center;color:navy">নিজের প্রোফাইল তৈরি করুন</h3>
<input id="n" placeholder="আপনার নাম *">
<select id="j"><option value="">পেশা *</option><option>ইলেকট্রিশিয়ান</option><option>রাজমিস্ত্রি</option><option>প্লাম্বার</option><option>ডাক্তার</option><option>নার্স</option><option>ড্রাইভার</option></select>
<input id="d" placeholder="জেলা">
<input id="p" placeholder="ফোন নাম্বার *">
<input id="ex" placeholder="অভিজ্ঞতা">
<input id="fee" placeholder="মজুরি">
<textarea id="desc" placeholder="আপনার সম্পর্কে"></textarea>
<input id="img" placeholder="ছবির লিংক">
<button class="btn-save" onclick="saveWorker()">প্রোফাইল তৈরি করুন</button>
<button class="btn-cancel" onclick="closeModal()">বাতিল</button>
<p id="msg" style="text-align:center;color:green;margin-top:10px"></p>
</div></div>
<script>
var firebaseConfig={databaseURL:"https://needybd-70d0b-default-rtdb.firebaseio.com"};
firebase.initializeApp(firebaseConfig);
var db=firebase.database();
function openModal(){document.getElementById('modal').style.display='block';}
function closeModal(){document.getElementById('modal').style.display='none';}
db.ref('workers').on('value',function(snap){
 var grid=document.getElementById('grid');grid.innerHTML='';
 if(!snap.exists()){grid.innerHTML='<p style="grid-column:1/-1;text-align:center;padding:30px;color:gray">কোনো কর্মী নেই</p>';return;}
 snap.forEach(function(c){var w=c.val();var d=document.createElement('div');d.className='card';d.innerHTML='<img src="'+(w.photo||'https://i.imgur.com/8Km9tLL.png')+'"><div class="card-body"><b>'+w.name+'</b><br><small>'+w.job+' | '+w.district+'</small><br><small style="color:green">'+w.fee+'</small><button class="hire">কল: '+w.phone+'</button></div>';grid.appendChild(d);});
});
function saveWorker(){
 var name=document.getElementById('n').value.trim();
 var job=document.getElementById('j').value;
 var phone=document.getElementById('p').value.trim();
 if(name==''||job==''||phone==''){alert('নাম, পেশা, ফোন - এই ৩টা ঘর অবশ্যই পূরণ করুন সোনা!');return;}
 document.getElementById('msg').innerText='সেভ হচ্ছে, একটু অপেক্ষা করুন...';
 db.ref('workers').push({
  name:document.getElementById('n').value,
  job:document.getElementById('j').value,
  district:document.getElementById('d').value,
  phone:document.getElementById('p').value,
  experience:document.getElementById('ex').value,
  fee:document.getElementById('fee').value,
  description:document.getElementById('desc').value,
  photo:document.getElementById('img').value||'https://i.imgur.com/8Km9tLL.png',
  time:Date.now()
 }).then(function(){document.getElementById('msg').innerText='সফল! প্রোফাইল তৈরি হয়েছে!';setTimeout(closeModal,1500);}).catch(function(e){alert('Firebase Error: '+e.message);});
}
</script>
</body>
</html>
