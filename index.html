<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeedyBD.com - Trustworthy Service</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#f0f2f5}
.header{background:#fff;padding:10px 15px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 5px rgba(0,0,0,.1);position:sticky;top:0;z-index:100}
.logo{font-weight:900;color:#000080}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.1);position:relative}
.card img{width:100%;height:130px;object-fit:cover}
.badge{position:absolute;top:6px;left:6px;background:green;color:#fff;font-size:10px;padding:2px 6px;border-radius:10px}
.card-body{padding:8px}.card-body h3{font-size:13px;color:#000080}
.hire{background:linear-gradient(45deg,red,navy);color:#fff;border:none;width:100%;padding:7px;border-radius:6px;margin-top:6px;font-size:11px;font-weight:bold}
.join{background:linear-gradient(45deg,red,navy);color:#fff;border:none;padding:13px 20px;border-radius:50px;font-weight:bold;position:fixed;bottom:18px;right:15px;z-index:999;box-shadow:0 4px 15px rgba(0,0,0,.3)}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;padding:15px;overflow:auto}
#modal .box{background:#fff;max-width:450px;margin:20px auto;padding:18px;border-radius:12px}
.box input,.box select,.box textarea{width:100%;padding:10px;margin:6px 0;border:1px solid #ccc;border-radius:6px}
</style>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>
<div class="header"><div class="logo">NEEDYBD.COM</div><small>TRUSTWORTHY SERVICE</small></div>
<div style="padding:12px"><input id="search" placeholder="খুঁজুন: ডাক্তার, মিস্ত্রি..." style="width:70%;padding:9px;border-radius:8px;border:1px solid #ccc"><button onclick="doSearch()" style="padding:9px 14px;background:navy;color:#fff;border:none;border-radius:8px">খুঁজুন</button></div>
<div class="grid" id="grid">লোড হচ্ছে...</div>
<button class="join" onclick="document.getElementById('modal').style.display='block'">+ কর্মী হিসেবে যোগ দিন</button>
<div id="modal"><div class="box">
<h3 style="text-align:center;color:navy">নিজের প্রোফাইল তৈরি করুন</h3>
<input id="n" placeholder="নাম *"><select id="j"><option value="">পেশা *</option><option>রাজমিস্ত্রি</option><option>ইলেকট্রিশিয়ান</option><option>প্লাম্বার</option><option>ডাক্তার</option><option>নার্স</option><option>ড্রাইভার</option></select>
<input id="d" placeholder="জেলা *"><input id="p" placeholder="ফোন *"><input id="e" placeholder="অভিজ্ঞতা"><input id="f" placeholder="ফি"><textarea id="desc" placeholder="বিবরণ"></textarea><input id="img" placeholder="ছবির লিংক (ঐচ্ছিক)">
<button onclick="saveWorker()" style="width:100%;padding:12px;background:navy;color:#fff;border:none;border-radius:8px;font-weight:bold;margin-top:8px">প্রোফাইল তৈরি করুন</button>
<button onclick="document.getElementById('modal').style.display='none'" style="width:100%;padding:9px;margin-top:8px;border:none;background:#eee;border-radius:8px">বাতিল</button>
</div></div>
<script>
const firebaseConfig = { databaseURL: "https://needybd-70d0b-default-rtdb.firebaseio.com" };
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const grid = document.getElementById('grid');
function load(){
 db.ref('workers').on('value', snap=>{
  grid.innerHTML=''; if(!snap.exists()){grid.innerHTML='<p style="grid-column:1/-1;text-align:center">কোন কর্মী নেই</p>';return;}
  snap.forEach(c=>{ const w=c.val(); const div=document.createElement('div'); div.className='card';
   div.innerHTML=`<div class="badge">${w.verified?'✓ VERIFIED':'NEW'}</div><img src="${w.photo||'https://via.placeholder.com/300'}"><div class="card-body"><h3>${w.name}</h3><p style="font-size:11px">🔧 ${w.job} | 📍 ${w.district}</p><p style="font-size:11px">💰 ${w.fee||''}</p><button class="hire" onclick="alert('কল: ${w.phone}')">হায়ার - ${w.phone}</button></div>`; grid.appendChild(div);
  });
 });
}
load();
function saveWorker(){
 const data={name:document.getElementById('n').value, job:document.getElementById('j').value, district:document.getElementById('d').value, phone:document.getElementById('p').value, experience:document.getElementById('e').value, fee:document.getElementById('f').value, description:document.getElementById('desc').value, photo:document.getElementById('img').value||'https://i.imgur.com/8Km9tLL.png', verified:false, timestamp:Date.now()};
 if(!data.name||!data.job||data.phone.length<11){alert('নাম, পেশা, ফোন ঠিক দিন');return;}
 db.ref('workers').push(data).then(()=>{alert('প্রোফাইল তৈরি হয়েছে!'); document.getElementById('modal').style.display='none';});
}
function doSearch(){ const q=document.getElementById('search').value.toLowerCase(); document.querySelectorAll('.card').forEach(c=>{c.style.display=c.innerText.toLowerCase().includes(q)?'block':'none'}) }
</script>
</body>
</html>
